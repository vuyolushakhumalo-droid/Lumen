<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lintel — Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#06080D; --bg-2:#080B11; --surface:#0D131C; --surface-2:#121B26; --surface-3:#17222F;
    --ink:#F2F5F9; --grey:#A2AEBC; --grey-dim:#64717F; --line:rgba(255,255,255,0.055); --line-2:rgba(255,255,255,0.10);
    --cyan:#5FE0FF; --cyan-2:#8DEBFF; --glow:rgba(95,224,255,0.45);
    --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg); color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; letter-spacing:-0.011em; overflow:hidden;
    background-image:radial-gradient(900px 520px at 80% -12%, rgba(95,224,255,0.07), transparent 60%), radial-gradient(680px 480px at 2% 112%, rgba(95,224,255,0.05), transparent 55%);}
  button{font-family:inherit; cursor:pointer; color:inherit}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.09);border-radius:8px} ::-webkit-scrollbar-track{background:transparent}
  .app{display:flex; flex-direction:column; height:100vh}

  /* top bar */
  .topbar{display:flex; align-items:center; gap:18px; height:60px; padding:0 22px; border-bottom:1px solid var(--line); flex:none; background:rgba(8,11,17,0.55); backdrop-filter:blur(18px)}
  .brand{display:flex; align-items:center; gap:10px; flex:none; text-decoration:none; color:inherit; cursor:pointer; transition:opacity .2s}
  .brand:hover{opacity:.7}
  .tedit{background:var(--surface-3); border:1px solid rgba(95,224,255,0.45); border-radius:7px; color:var(--ink); font-family:var(--font); font-size:13px; padding:3px 8px; width:130px; outline:none}
  .brand svg{width:21px; height:21px}
  .brand b{font-weight:600; font-size:16px; letter-spacing:-0.01em}
  .tabswrap{flex:1; display:flex; align-items:center; min-width:0}
  .tabs{display:flex; align-items:center; gap:3px; flex:1; overflow-x:auto; padding:0 6px}
  .tabs::-webkit-scrollbar{height:0}
  .tabscroll{width:26px; height:26px; border-radius:50%; border:none; background:transparent; color:var(--grey-dim);
    display:flex; align-items:center; justify-content:center; flex:none; opacity:0; pointer-events:none; transition:.2s}
  .tabscroll.show{opacity:1; pointer-events:auto}
  .tabscroll:hover{color:var(--cyan); background:rgba(95,224,255,0.08)}
  .tabscroll svg{width:15px; height:15px}
  .tab{display:flex; align-items:center; gap:9px; padding:8px 15px; border-radius:980px; font-size:13px; color:var(--grey-dim); background:transparent; white-space:nowrap; transition:color .3s, background .3s}
  .tab:hover{color:var(--ink); background:rgba(255,255,255,0.04)}
  .tab.active{color:var(--ink); background:rgba(95,224,255,0.08)}
  .tab .dotc{width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 9px var(--cyan); opacity:0; transition:opacity .3s}
  .tab.active .dotc{opacity:1}
  .tab .close{opacity:.4; font-size:16px; line-height:1; padding:0 3px; border-radius:6px; transition:.2s}
  .tab .close:hover{opacity:1; background:rgba(255,255,255,.08)}
  .newtab{width:30px; height:30px; border-radius:50%; border:none; background:transparent; color:var(--grey-dim); font-size:19px; font-weight:300; display:flex; align-items:center; justify-content:center; flex:none; transition:.25s}
  .newtab:hover{color:var(--cyan); background:rgba(95,224,255,0.08)}
  .top-actions{display:flex; align-items:center; gap:4px; flex:none}
  .tbtn{display:flex; align-items:center; gap:8px; padding:9px 15px; border-radius:980px; font-size:13px; font-weight:500; color:var(--grey); background:transparent; border:none; transition:color .25s, background .25s, transform .15s}
  .tbtn:hover{color:var(--ink); background:rgba(255,255,255,0.05)}
  .tbtn svg{width:15px; height:15px}
  .tbtn.pub{color:#04141B; background:var(--cyan); padding:9px 19px; box-shadow:0 0 34px -12px var(--glow)}
  .tbtn.pub:hover{background:var(--cyan-2); transform:translateY(-1px)}

  /* main split */
  .main{flex:1; display:flex; min-height:0}
  .pane{display:flex; flex-direction:column; min-height:0; min-width:0}
  .left{flex:1; max-width:540px; border-right:1px solid var(--line)}
  .right{flex:1.3; background:var(--bg-2)}

  /* left header */
  .seg{display:flex; align-items:center; gap:5px; padding:18px 22px 12px; flex:none}
  .seg .pill{padding:7px 16px; border-radius:980px; font-size:13px; font-weight:500; color:var(--grey-dim); background:transparent; border:none; transition:color .25s, background .25s}
  .seg .pill:hover{color:var(--ink)}
  .seg .pill.on{color:var(--ink); background:rgba(255,255,255,0.06)}
  .seg .spacer{flex:1}
  .seg .hint{font-size:12px; color:var(--grey-dim); letter-spacing:0.02em}

  /* chat */
  .scroll{flex:1; overflow-y:auto; padding:14px 22px 26px; min-height:0}
  .msg{display:flex; gap:13px; margin-bottom:26px}
  .msg .av{width:28px; height:28px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:500}
  .msg.user .av{background:rgba(255,255,255,0.05); color:var(--grey-dim)}
  .msg.ai .av{background:rgba(95,224,255,0.08); border:1px solid rgba(95,224,255,0.16); box-shadow:0 0 22px -8px var(--glow)}
  .msg .av svg{width:15px; height:15px}
  .msg .body{font-size:15px; line-height:1.66; color:var(--ink); padding-top:4px}
  .msg.user .body{color:var(--grey)}
  .msg .built{display:inline-flex; align-items:center; gap:8px; margin-top:12px; font-size:12.5px; color:var(--cyan); background:rgba(95,224,255,0.06); padding:7px 13px; border-radius:980px}
  .msg .built svg{width:13px; height:13px}
  .thinking{display:flex; align-items:center; gap:10px; color:var(--grey); font-size:14px}
  .dots{display:flex; gap:5px}
  .dots i{width:6px; height:6px; border-radius:50%; background:var(--cyan); animation:bounce 1.3s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.16s} .dots i:nth-child(3){animation-delay:.32s}
  @keyframes bounce{0%,100%{opacity:.3; transform:translateY(0)}50%{opacity:1; transform:translateY(-3px)}}
  .empty{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--grey-dim); gap:18px; padding:20px}
  .empty svg{width:30px; height:30px; opacity:.45}
  .empty h3{color:var(--grey); font-weight:400; font-size:17px; letter-spacing:-0.02em}
  .starters{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin-top:4px}
  .starter{font-size:12.5px; color:var(--grey); border:1px solid var(--line); background:transparent; padding:9px 15px; border-radius:980px; transition:.25s}
  .starter:hover{border-color:rgba(95,224,255,0.35); color:var(--ink); background:rgba(95,224,255,0.04)}

  /* code */
  .code{flex:1; overflow:auto; padding:22px; font-family:var(--mono); font-size:12.5px; line-height:1.85; color:#93A2B2; white-space:pre; min-height:0; display:none}
  .code .tag{color:var(--cyan)} .code .att{color:#7FA6BE}

  /* composer */
  .composer{padding:12px 22px 22px; flex:none}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px}
  .chip{display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--grey); background:rgba(255,255,255,0.04); padding:6px 11px; border-radius:980px}
  .chip .x{cursor:pointer; opacity:.5} .chip .x:hover{opacity:1}
  .inputbox{border:1px solid var(--line-2); border-radius:20px; background:rgba(255,255,255,0.02); transition:border-color .3s, box-shadow .3s, background .3s}
  .inputbox:focus-within{border-color:rgba(95,224,255,0.45); box-shadow:0 0 44px -16px var(--glow); background:rgba(95,224,255,0.02)}
  .inputbox textarea{width:100%; background:transparent; border:none; outline:none; resize:none; color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.55; padding:16px 18px 6px; max-height:150px}
  .inputbox textarea::placeholder{color:var(--grey-dim)}
  .toolrow{display:flex; align-items:center; gap:5px; padding:6px 10px 10px}
  .iconbtn{width:35px; height:35px; border-radius:50%; border:none; background:transparent; color:var(--grey-dim); display:flex; align-items:center; justify-content:center; transition:.25s}
  .iconbtn:hover{color:var(--ink); background:rgba(255,255,255,0.06)}
  .iconbtn.rec{color:#FF8A8A; background:rgba(255,138,138,0.1)}
  .iconbtn svg{width:18px; height:18px}
  .modelsel{display:flex; align-items:center; gap:8px; padding:0 13px; height:35px; border-radius:980px; border:none; background:transparent; color:var(--grey-dim); font-size:12.5px; font-weight:500; transition:.25s}
  .modelsel:hover{color:var(--ink); background:rgba(255,255,255,0.06)}
  .modelsel svg{width:13px; height:13px; color:var(--cyan); opacity:.8}
  .modelsel select{background:transparent; border:none; outline:none; color:inherit; font-family:var(--font); font-size:12.5px; font-weight:500; cursor:pointer}
  .modelsel select option{background:var(--surface-2); color:var(--ink)}
  .spacer{flex:1}
  .send{width:38px; height:38px; border-radius:50%; border:none; background:var(--cyan); color:#04141B; display:flex; align-items:center; justify-content:center; box-shadow:0 0 28px -10px var(--glow); transition:transform .15s, background .2s}
  .send:hover{transform:translateY(-1px); background:var(--cyan-2)} .send:disabled{opacity:.4; box-shadow:none; transform:none}
  .send svg{width:17px; height:17px}

  /* preview */
  .previewhead{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); flex:none; background:transparent}
  .dots3{display:flex; gap:7px} .dots3 span{width:10px; height:10px; border-radius:50%; opacity:.9}
  .url{flex:1; max-width:320px; margin:0 auto; font-family:var(--mono); font-size:11.5px; color:var(--grey-dim); background:rgba(255,255,255,0.03); border:1px solid var(--line); padding:7px 14px; border-radius:980px; text-align:center; letter-spacing:0.01em}
  .phb{width:33px; height:33px; border-radius:50%; border:none; background:transparent; color:var(--grey-dim); display:flex; align-items:center; justify-content:center; transition:.25s}
  .phb:hover{color:var(--ink); background:rgba(255,255,255,0.06)} .phb svg{width:15px; height:15px}
  .previewwrap{flex:1; position:relative; min-height:0; background:#fff}
  iframe{width:100%; height:100%; border:none; display:block; background:#fff}
  .previewempty{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; background:var(--bg-2); color:var(--grey-dim); font-size:14px; letter-spacing:0.01em}
  .reactor{position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center}
  .rc{position:absolute; width:46px; height:46px; border-radius:50%; background:radial-gradient(circle,#EAFBFF,var(--cyan-2) 30%,var(--cyan) 55%,transparent 78%); box-shadow:0 0 54px 8px var(--glow); animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1); opacity:.82}50%{transform:scale(1.13); opacity:1}}
  .rr{position:absolute; border-radius:50%; border:1px solid rgba(95,224,255,.28)}
  .rr.a{width:92px; height:92px; animation:spin 10s linear infinite}
  .rr.b{width:134px; height:134px; border-style:dashed; border-color:rgba(95,224,255,.14); animation:spin 18s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}

  .allowance{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--grey-dim);padding:7px 14px;border-radius:980px;background:rgba(255,255,255,0.03);transition:.25s;text-decoration:none}
  .allowance:hover{color:var(--ink);background:rgba(255,255,255,0.06)}
  .allowance b{color:var(--cyan);font-weight:600}
  .allowance.low b{color:#F6B24C}
  .hist{position:absolute;right:16px;top:52px;width:290px;max-height:340px;overflow-y:auto;border:1px solid var(--line-2);border-radius:16px;background:rgba(13,19,28,0.97);backdrop-filter:blur(16px);box-shadow:0 30px 70px -30px rgba(0,0,0,.9);padding:10px;z-index:80;display:none}
  .hist.show{display:block}
  .hist h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey-dim);padding:8px 10px 10px;font-weight:500}
  .hrow{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;cursor:pointer;transition:.2s}
  .hrow:hover{background:rgba(255,255,255,0.05)}
  .hrow .hn{width:26px;height:26px;border-radius:8px;flex:none;background:rgba(95,224,255,.09);color:var(--cyan);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .hrow .ht{font-size:13.5px;color:var(--ink);line-height:1.35}
  .hrow .hm{font-size:11.5px;color:var(--grey-dim);margin-top:2px}
  .hist .none{font-size:13px;color:var(--grey-dim);padding:12px 11px}
  .tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;width:100%;max-width:380px}
  .tpl{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;background:transparent;transition:.25s}
  .tpl:hover{border-color:rgba(95,224,255,.35);background:rgba(95,224,255,.04)}
  .tpl .ti{width:28px;height:28px;border-radius:9px;background:rgba(95,224,255,.08);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .tpl .ti svg{width:15px;height:15px;color:var(--cyan)}
  .tpl .tt{font-size:13.5px;font-weight:500;color:var(--ink)}
  .tpl .td{font-size:11.5px;color:var(--grey-dim);margin-top:2px}

  .pubwrap{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:24px;
    background:rgba(3,5,9,.72);backdrop-filter:blur(8px)}
  .pubwrap.show{display:flex}
  .pubmodal{width:100%;max-width:520px;border:1px solid var(--line-2);border-radius:22px;
    background:linear-gradient(180deg,var(--surface-2),var(--surface));padding:32px;position:relative;
    box-shadow:0 50px 120px -40px rgba(0,0,0,.9);max-height:90vh;overflow-y:auto}
  .pubmodal h3{font-size:22px;font-weight:600;letter-spacing:-.03em;margin-bottom:8px}
  .pubmodal .sub{font-size:14.5px;color:var(--grey);line-height:1.55;margin-bottom:24px}
  .pubclose{position:absolute;top:16px;right:18px;width:32px;height:32px;border-radius:50%;border:none;
    background:transparent;color:var(--grey-dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .pubclose:hover{color:var(--ink);background:rgba(255,255,255,.06)}
  .pubclose svg{width:17px;height:17px}
  .pubfield{margin-bottom:18px}
  .pubfield label{display:block;font-size:13.5px;font-weight:500;color:var(--ink-2);margin-bottom:8px}
  .slugrow{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:12px;
    background:rgba(255,255,255,.03);overflow:hidden;transition:.25s}
  .slugrow:focus-within{border-color:var(--cyan);box-shadow:0 0 30px -14px var(--glow)}
  .slugrow input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);
    font-family:var(--font);font-size:15px;padding:13px 14px}
  .slugrow .suffix{font-size:14px;color:var(--grey-dim);padding:0 14px 0 0;white-space:nowrap}
  .puberr{display:none;font-size:13.5px;color:#FF9B9B;background:rgba(255,107,107,.08);
    border:1px solid rgba(255,107,107,.28);border-radius:11px;padding:11px 14px;margin-bottom:16px;line-height:1.5}
  .puberr.show{display:block}
  .livebox{border:1px solid rgba(95,224,255,.3);background:rgba(95,224,255,.06);border-radius:14px;padding:18px;margin-bottom:20px}
  .liveurl{display:flex;align-items:center;gap:10px;margin-top:10px}
  .liveurl a{flex:1;font-size:14.5px;color:var(--cyan);text-decoration:none;word-break:break-all}
  .liveurl button{flex:none;background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:var(--ink);
    border-radius:9px;padding:8px 13px;font-size:12.5px;cursor:pointer;font-family:var(--font)}
  .liveurl button:hover{background:rgba(255,255,255,.1)}
  .livelabel{font-size:12.5px;color:var(--grey-dim);display:flex;align-items:center;gap:8px}
  .livedot{width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 8px #4ADE80}
  .pubactions{display:flex;gap:10px;flex-wrap:wrap}
  .pubactions .btnp{flex:1;min-width:150px;justify-content:center;border:none;border-radius:980px;
    padding:13px 20px;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:.2s}
  .btnp.primary{background:var(--cyan);color:#04141B;box-shadow:0 0 34px -12px var(--glow)}
  .btnp.primary:hover{transform:translateY(-1px)}
  .btnp.primary:disabled{opacity:.5;transform:none;cursor:default}
  .btnp.ghost{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line-2)}
  .btnp.ghost:hover{background:rgba(255,255,255,.09)}
  .domainlink{font-size:13.5px;color:var(--grey);margin-top:18px;text-align:center}
  .domainlink a{color:var(--cyan);text-decoration:none;cursor:pointer}
  .dnsbox{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
  .dnsbox.show{display:block}
  .dnsbox table{width:100%;border-collapse:collapse;font-size:13px}
  .dnsbox th{text-align:left;padding:9px 12px;color:var(--grey-dim);font-weight:500;border-bottom:1px solid var(--line);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  .dnsbox td{padding:10px 12px;color:var(--ink-2);border-bottom:1px solid rgba(255,255,255,.04);font-family:var(--mono);font-size:12.5px}
  .dnsbox tr:last-child td{border-bottom:none}
  .iconbtn.listening{color:var(--cyan);background:rgba(95,224,255,.12);box-shadow:0 0 0 3px rgba(95,224,255,.12)}
  .iconbtn.listening svg{animation:micPulse 1.4s ease-in-out infinite}
  @keyframes micPulse{0%,100%{opacity:.6}50%{opacity:1}}
  .voicebar{display:none;align-items:center;gap:11px;padding:10px 14px;margin-bottom:10px;
    border:1px solid rgba(95,224,255,.3);background:rgba(95,224,255,.06);border-radius:14px}
  .voicebar.show{display:flex}
  .voicebar .vdot{width:8px;height:8px;border-radius:50%;background:var(--cyan);flex:none;
    box-shadow:0 0 10px var(--cyan);animation:micPulse 1.2s ease-in-out infinite}
  .voicebar .vtext{flex:1;font-size:13.5px;color:var(--ink-2);line-height:1.4}
  .voicebar .vstop{flex:none;background:rgba(255,255,255,.08);border:none;color:var(--ink);
    border-radius:980px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:var(--font)}
  .voicebar .vstop:hover{background:rgba(255,255,255,.14)}
  .speaktoggle{display:flex;align-items:center;gap:7px;padding:0 11px;height:35px;border-radius:980px;
    border:none;background:transparent;color:var(--grey-dim);font-size:12.5px;font-weight:500;transition:.25s}
  .speaktoggle:hover{color:var(--ink);background:rgba(255,255,255,.06)}
  .speaktoggle.on{color:var(--cyan);background:rgba(95,224,255,.08)}
  .speaktoggle svg{width:15px;height:15px}
  .devices{display:flex;gap:3px;padding:3px;border-radius:980px;background:rgba(255,255,255,.04)}
  .devbtn{width:32px;height:28px;border:none;background:transparent;color:var(--grey-dim);border-radius:980px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
  .devbtn:hover{color:var(--ink)}
  .devbtn.on{color:#04141B;background:var(--cyan)}
  .devbtn svg{width:15px;height:15px}
  .previewwrap{display:flex;align-items:center;justify-content:center;overflow:auto;padding:0}
  .previewwrap.framed{padding:22px;background:var(--bg-2)}
  iframe.device{border:1px solid var(--line-2);border-radius:14px;box-shadow:0 30px 70px -30px rgba(0,0,0,.8);
    transition:width .35s cubic-bezier(.2,.7,.2,1), height .35s cubic-bezier(.2,.7,.2,1)}
  .planbox{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.02)}
  .planhead{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;font-size:12.5px;color:var(--grey);
    transition:.2s;user-select:none}
  .planhead:hover{color:var(--ink);background:rgba(255,255,255,.03)}
  .planhead .chev{margin-left:auto;width:13px;height:13px;transition:transform .25s}

<script>
(function(){
  // ============================================================
  // Builder — now talks to your real API.
  // Projects, versions and usage all live in the database.
  // ============================================================

  var MODEL_KEYS = {
    'Auto (recommended)': 'auto',
    'Claude Opus 5': 'opus',
    'Claude Fable 5': 'fable'
  };

  var projects = [], activeId = null, mode = 'chat', usage = null;
  var chats = {};   // in-memory conversation per project

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function active(){ return projects.filter(function(p){return p.id===activeId;})[0]; }

  // ---------- elements ----------
  var tabsEl=document.getElementById('tabs'), scroll=document.getElementById('scroll'), codeView=document.getElementById('codeView');
  var tabsLeftBtn=document.getElementById('tabsLeft'), tabsRightBtn=document.getElementById('tabsRight');
  var liveBadge=document.getElementById('liveCode');
  var preview=document.getElementById('preview'), previewEmpty=document.getElementById('previewempty'), urlEl=document.getElementById('url');
  var promptEl=document.getElementById('prompt'), chipsEl=document.getElementById('chips'), projName=document.getElementById('projName');
  var toastEl=document.getElementById('toast'), toastText=document.getElementById('toasttext');
  var histPanel=document.getElementById('histPanel'), histList=document.getElementById('histList');
  var pendingFiles=[];

  function toast(msg){ toastText.textContent=msg; toastEl.classList.add('show'); setTimeout(function(){toastEl.classList.remove('show');},2400); }

  // ---------- allowance ----------
  async function refreshUsage(){
    try{
      usage = await Lumen.api('/api/usage');
      var el=document.getElementById('bleft');
      if(el){ el.textContent = usage.buildsLeft + (usage.topupCredits ? '+' + usage.topupCredits : ''); }
      var wrap=document.getElementById('allowance');
      if(wrap) wrap.classList.toggle('low', usage.buildsLeft <= 3);

      // Only offer models the plan allows
      var sel=document.getElementById('model');
      if(sel && usage.allowedModels && usage.allowedModels.length){
        var labels={opus:'Claude Opus 5', fable:'Claude Fable 5'};
        var current=sel.value;
        sel.innerHTML='';
        var autoOpt=document.createElement('option'); autoOpt.text='Auto (recommended)'; sel.appendChild(autoOpt);
        usage.allowedModels.forEach(function(k){
          if(!labels[k]) return;
          var o=document.createElement('option'); o.text=labels[k]; sel.appendChild(o);
        });
        if(Array.prototype.some.call(sel.options,function(o){return o.text===current;})) sel.value=current;
        else if(sel.options.length) sel.value = sel.options[sel.options.length>1?1:0].text;
      }
    }catch(e){ /* not fatal */ }
  }

  // ---------- projects ----------
  function projectIdFromUrl(){
    try{ return new URLSearchParams(window.location.search).get('project'); }catch(e){ return null; }
  }

  async function loadProjects(){
    var out = await Lumen.api('/api/projects');
    projects = out.projects || [];
    if(!activeId || !active()){
      var wanted = projectIdFromUrl();
      var fromUrl = wanted && projects.filter(function(p){ return p.id===wanted; })[0];
      if(fromUrl){
        activeId = fromUrl.id;
      } else {
        var blank = projects.filter(function(p){ return !p.hasBuild; })[0];
        if(blank){
          activeId = blank.id;
        } else {
          var made = await Lumen.api('/api/projects', { method:'POST', body: JSON.stringify({ name:'New project' }) });
          projects.push(made.project);
          activeId = made.project.id;
        }
      }
    }
    renderAll();
    loadChat(activeId);
  }

  function renderTabs(){
    tabsEl.innerHTML='';
    projects.forEach(function(p){
      var t=document.createElement('div');
      t.className='tab'+(p.id===activeId?' active':'');
      t.title='Double-click to rename';
      t.dataset.id=p.id;
      t.innerHTML='<span class="dotc"></span><span class="tname">'+esc(p.name)+'</span>'+
                  (projects.length>1?'<span class="close" data-id="'+p.id+'">\u00d7</span>':'');
      t.addEventListener('click', function(e){
        if(e.target.classList.contains('close')||e.target.classList.contains('tedit')) return;
        // Already active -- nothing to switch, and staying a no-op here
        // is what lets a following dblclick rename without a switch (and
        // the re-render it triggers) landing in between the two clicks.
        if(p.id===activeId) return;
        activeId=p.id; renderAll(); loadChat(p.id);
      });
      var nm=t.querySelector('.tname');
      nm.addEventListener('dblclick', function(e){ e.stopPropagation(); renameTab(p); });
      tabsEl.appendChild(t);
    });
    tabsEl.querySelectorAll('.close').forEach(function(c){
      c.addEventListener('click', function(e){
        e.stopPropagation();
        var id=c.getAttribute('data-id');
        // Closes the tab only — deleting a project happens from the dashboard.
        projects=projects.filter(function(p){return p.id!==id;});
        if(activeId===id && projects.length) activeId=projects[0].id;
        if(!projects.length) return loadProjects();
        renderAll();
      });
    });
    updateTabScroll();
  }

  // Step size follows the actual rendered tab width, so a click moves
  // roughly one tab regardless of how long project names are.
  function tabScrollStep(){
    var first = tabsEl.querySelector('.tab');
    return first ? (first.offsetWidth + 3) : 160;
  }
  function updateTabScroll(){
    var overflow = tabsEl.scrollWidth > tabsEl.clientWidth + 1;
    tabsLeftBtn.classList.toggle('show', overflow && tabsEl.scrollLeft > 4);
    tabsRightBtn.classList.toggle('show', overflow && tabsEl.scrollLeft < tabsEl.scrollWidth - tabsEl.clientWidth - 4);
  }

  function renameTab(p){
    // Looked up live rather than handed a reference captured before the
    // click -- a click that switches tabs re-renders the whole strip,
    // which would otherwise leave this holding a detached node.
    var tabNode = tabsEl.querySelector('.tab[data-id="'+p.id+'"]');
    var span = tabNode ? tabNode.querySelector('.tname') : null;
    if(!span) return;
    var inp=document.createElement('input'); inp.className='tedit'; inp.value=p.name;
    span.replaceWith(inp); inp.focus(); inp.select();
    var done=false;
    async function commit(save){
      if(done) return; done=true;
      var v=inp.value.trim();
      if(save && v && v!==p.name){
        try{ await Lumen.api('/api/projects/'+p.id, { method:'PATCH', body: JSON.stringify({ name:v }) }); p.name=v; }
        catch(e){ toast(e.message); }
      }
      renderAll();
    }
    inp.addEventListener('click', function(e){ e.stopPropagation(); });
    inp.addEventListener('blur', function(){ commit(true); });
    inp.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); commit(true); }
      else if(e.key==='Escape'){ commit(false); }
    });
  }

  // ---------- chat ----------
  function messages(){ if(!chats[activeId]) chats[activeId]=[]; return chats[activeId]; }

  // Pull the saved conversation for a project (once per session).
  var loadedChats = {};
  async function loadChat(projectId){
    if(loadedChats[projectId]) return;
    loadedChats[projectId] = true;
    try{
      var out = await Lumen.api('/api/projects/'+projectId+'/messages');
      var msgs = (out.messages || []).map(function(m){
        return m.role === 'user'
          ? { role:'user', text:m.content }
          : { role:'ai', text:m.content, built:true, plan:m.plan, model:m.model_used };
      });
      if(msgs.length){ chats[projectId] = msgs; if(projectId === activeId) renderChat(); }
    }catch(e){ /* not fatal */ }
  }

    scroll.querySelectorAll('.planhead').forEach(function(head){

        promptEl.dispatchEvent(new Event('input'));

    scroll.querySelectorAll('.applyPending').forEach(function(btn){
      btn.addEventListener('click', async function(){

          });

          renderAll();
          toast('Restored the previous version');

  // Marks the most recent unresolved pending-replacement message as
  // resolved, so its Apply/Discard buttons stop re-rendering.
  function resolvePendingMessage(){
    var arr = chats[activeId] || [];
    for(var i=arr.length-1; i>=0; i--){
      if(arr[i].pending && !arr[i].pendingResolved){ arr[i].pendingResolved = true; break; }
    }
  }

  function highlight(code){
    return esc(code).replace(/(&lt;\/?)([a-zA-Z0-9]+)/g,'$1<span class="tag">$2</span>').replace(/([a-zA-Z-]+)=/g,'<span class="att">$1</span>=');
  }
  function renderCode(){
    var p=active();
    codeView.innerHTML = (p && p.current_code) ? highlight(p.current_code)
      : '<span style="color:#5D6875">// Your generated code appears here once you build something.</span>';
  }
  // A srcdoc iframe has an opaque (null) origin, so history.pushState/
  // replaceState throw SecurityError there even though the exact same
  // call works fine once the site is actually published to a real
  // origin. Only the preview needs this -- p.current_code itself (what
  // gets saved and published) is left untouched.
  function withPreviewNavGuard(html){
    var guard = '<script>(function(){var h=window.history;["pushState","replaceState"].forEach(function(m){'
      + 'var orig=h[m];h[m]=function(){try{return orig.apply(h,arguments);}catch(e){}};});})();<\/script>';
    var m = html.match(/<!doctype[^>]*>/i);
    return m ? html.slice(0,m.index+m[0].length) + guard + html.slice(m.index+m[0].length) : guard + html;
  }

  function renderPreview(){
    var p=active();
    if(p && p.current_code){ preview.srcdoc=withPreviewNavGuard(p.current_code); previewEmpty.style.display='none'; }
    else { preview.srcdoc=''; previewEmpty.style.display='flex'; }
    urlEl.textContent = (p && p.preview_url) || 'preview.lintelsites.com';
  }
  function setMode(m){
    mode=m;
    document.getElementById('segChat').classList.toggle('on', m==='chat');
    document.getElementById('segCode').classList.toggle('on', m==='code');
    scroll.style.display = m==='chat' ? 'block':'none';
    codeView.style.display = m==='code' ? 'block':'none';
    if(m==='code') renderCode();
  }
  function renderChips(){
    chipsEl.innerHTML = pendingFiles.map(function(f,i){
      return '<span class="chip"><img src="'+f.dataUrl+'" alt="" style="width:20px;height:20px;object-fit:cover;border-radius:4px;flex-shrink:0">'
        + '<span style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(f.name)+'">'+esc(f.name)+'</span>'
        + '<span class="x" data-i="'+i+'">\u00d7</span></span>';
    }).join('');
    chipsEl.querySelectorAll('.x').forEach(function(x){
      x.addEventListener('click', function(){ pendingFiles.splice(+x.getAttribute('data-i'),1); renderChips(); });
    });
  }
  function renderAll(){
    renderTabs();
    if(typeof paintUndo === 'function') paintUndo();
    var p=active();
    projName.textContent = p ? p.name : '';
    renderChat(); renderPreview();
    if(mode==='code') renderCode();
  }

  // ---------- generating (streamed, so you can watch it build) ----------
  var activeController = null;

  // Single toggle for both the "writing..." badge and Ray's fab
  // shrinking out of its way -- called from send()'s finally, so it
  // can't get stuck on a failed/aborted/conflicted build.
  function setGenerating(on){
    document.body.classList.toggle('generating', on);
    liveBadge.classList.toggle('show', on);
  }

  async function send(){
    var v=promptEl.value.trim();
    if(!v && !pendingFiles.length) return;
    var p=active(); if(!p) return;
    if(activeController){ toast('Already building — stop it first'); return; }

    var images = pendingFiles.map(function(f){
      return { mediaType: f.mediaType, data: f.dataUrl.slice(f.dataUrl.indexOf(',')+1) };
    });
    var full = v || (images.length ? 'Build from the attached image' + (images.length>1?'s':'') + '.' : '');

    var msgs=messages();
    msgs.push({role:'user', text: full || '(uploaded files)'});
    msgs.push({role:'thinking', stage:'Starting'});
    promptEl.value=''; promptEl.style.height='auto'; pendingFiles=[]; renderChips();
    if(mode!=='chat') setMode('chat');
    renderChat();

    var modelSel = document.getElementById('model');
    var modelLabel = modelSel ? (modelSel.options[modelSel.selectedIndex]||{}).text : 'Auto (recommended)';
    var modelKey = MODEL_KEYS[modelLabel] || 'auto';

    var editing = !!p.current_code;
    pushUndo(p);
    p.pendingReplacement = null;

    var sendBtn = document.getElementById('send');
    sendBtn.classList.add('busy');

    setGenerating(true);

    activeController = new AbortController();
    var stopBtn = document.getElementById('stopBuild');
    if(stopBtn) stopBtn.addEventListener('click', function(){
      if(activeController) activeController.abort();
    });

    var buffer = '';
    var meta = null;
    var lastPaint = 0;
    var planPreviewShown = false;
    var previewController = null;
    var previewTimer = null;

    // Edits: if the main request is still going after ~2s, fire a fast,
    // cheap teaser instead of leaving the chat empty. Builds don't need
    // this -- their own LUMEN-PLAN comment streams in early enough on
    // its own (see the chunk loop below).
    if(editing){
      previewTimer = setTimeout(async function(){
        previewTimer = null;
        previewController = new AbortController();
        try{
          var session2 = await Lumen.session();
          if(!session2) return;
          var pres = await fetch('/api/generate/preview', {
            method:'POST',
            headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+session2.access_token },
            body: JSON.stringify({ projectId:p.id, brief: full }),
            signal: previewController.signal
          });
          if(!pres.ok) return;
          var pdata = await pres.json().catch(function(){ return {}; });
          if(pdata && pdata.text) previewLine(pdata.text);
        }catch(e){ /* aborted or failed -- the real result is what matters */ }
      }, 2000);
    }

    function stage(text){
      var el=document.getElementById('buildStage'); if(el) el.textContent = text;
    }
    function counter(n){
      var el=document.getElementById('buildCount');
      if(el) el.textContent = n > 400 ? (Math.round(n/100)/10) + 'k chars' : '';
    }
    function previewLine(text){
      var el=document.getElementById('planPreview');
      if(el && text){ el.textContent = text; el.style.display='block'; }
    }

    try{
      var session = await Lumen.session();
      if(!session){ window.location.href='/start'; return; }

      var res = await fetch('/api/generate/stream', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+session.access_token },
        body: JSON.stringify({ projectId:p.id, brief: full, model: modelKey, images: images, clientExpectsEdit: editing }),
        signal: activeController.signal
      });

      if(!res.ok || !res.body){
        var err = await res.json().catch(function(){ return {}; });
        throw Object.assign(new Error(err.error || 'The build failed'), { status: res.status, data: err });
      }

      var reader = res.body.getReader();
      var decoder = new TextDecoder();

      while(true){
        var out = await reader.read();
        if(out.done) break;
        buffer += decoder.decode(out.value, { stream:true });

        // opening metadata: which model, and whether we're editing
        if(!meta){
          var startMatch = buffer.match(/<!--LUMEN-START ([\s\S]*?) -->/);
          if(startMatch){
            try{
              var info = JSON.parse(startMatch[1]);
              var bm=document.getElementById('buildModel');
              if(bm){ bm.textContent = info.model; bm.style.display=''; }
              stage(info.editing ? 'Making the change' : 'Designing your site');
            }catch(e){}
            buffer = buffer.replace(startMatch[0], '');
          }
        }

        // As soon as a new build's own plan comment parses, show its
        // message early -- it already streams in right after
        // <!DOCTYPE html>, we're just looking sooner. It stays part of
        // the saved document (cleanHtml never strips it), so unlike
        // LUMEN-START this is never removed from buffer.
        if(!planPreviewShown && !editing){
          var planMatch = buffer.match(/<!--LUMEN-PLAN (\{[\s\S]*?\}) -->/);
          if(planMatch){
            try{
              var earlyPlan = JSON.parse(planMatch[1]);
              if(earlyPlan && earlyPlan.message){ previewLine(earlyPlan.message); planPreviewShown = true; }
            }catch(e){}
          }
        }

        counter(buffer.length);

        // give a sense of what it's doing, from the HTML itself
        if(buffer.indexOf('</head>') > -1 && buffer.indexOf('</body>') === -1) stage('Building the pages');
        else if(buffer.indexOf('</body>') > -1) stage('Finishing up');
        else if(buffer.indexOf('<style') > -1) stage('Styling everything');

        // Hold the Preview steady during the build — it swaps to the
        // finished site in one clean update once the stream completes
        // (see renderAll()/renderPreview() below). The Code tab still
        // updates live here, if that's the active view.
        var now = Date.now();
        if(now - lastPaint > 700 && buffer.indexOf('</head>') > -1){
          lastPaint = now;
          if(mode==='code'){ codeView.innerHTML = highlight(buffer.slice(-6000)); codeView.scrollTop = codeView.scrollHeight; }
        }
      }

      // Whichever happens first -- the timer never fires, or an
      // in-flight preview call gets cancelled -- the real result wins.
      if(previewTimer){ clearTimeout(previewTimer); previewTimer = null; }
      if(previewController){ previewController.abort(); previewController = null; }

      // final metadata
      var metaMatch = buffer.match(/<!--LUMEN-META ([\s\S]*?) -->\s*$/);
      if(metaMatch){
        try{ meta = JSON.parse(metaMatch[1]); }catch(e){ meta = null; }
        buffer = buffer.replace(metaMatch[0], '').trim();
      }

      if(meta && meta.error) throw new Error(meta.error);

      chats[activeId] = msgs.filter(function(m){ return m.role!=='thinking'; });

      if(meta && meta.pending){
        // A near-total replacement was generated but held back --
        // current_code is untouched server-side. Hold the candidate
        // client-side until the user explicitly applies or discards it.
        p.pendingReplacement = { code: meta.pendingCode, title: meta.title };
        var pmsg = meta.reply || 'This edit looked like a full replacement rather than a small change, so I held it back.';
        chats[activeId].push({ role:'ai', text: pmsg, plan: meta.plan, model: meta.model, pending: true, conflict: !!meta.conflict });
        renderAll(); refreshUsage();
        speak(meta.conflict
          ? 'Another tab changed this project while your edit was generating — review it before applying.'
          : 'Held back a change that looked like a full replacement — review it before applying.');
      } else {
        p.current_code = (meta && meta.code) ? meta.code : buffer;
        if(meta){
          p.preview_url = meta.previewUrl || p.preview_url;
          if(meta.name) p.name = meta.name;
        }

        var msg = meta && meta.reply ? meta.reply : (editing ? 'Updated your site.' : 'Built your site.');
        if(meta && meta.truncated) msg += ' (It ran long, so the ending may be clipped — ask me to finish it.)';
        chats[activeId].push({ role:'ai', text: msg, built:true, plan: meta && meta.plan, model: meta && meta.model, undoToVersionId: meta && meta.undoToVersionId });

        renderAll(); paintUndo(); refreshUsage();
        speak(editing ? 'Updated. Take a look.' : 'Done — ' + ((meta && meta.title) || 'your site') + ' is ready.');
      }

    }catch(e){
      if(previewTimer){ clearTimeout(previewTimer); previewTimer = null; }
      if(previewController){ previewController.abort(); previewController = null; }
      chats[activeId] = msgs.filter(function(m){ return m.role!=='thinking'; });

      if(e.name === 'AbortError'){
        chats[activeId].push({ role:'ai', text:'Stopped. Nothing was saved, and you have not been charged a build.' });
      } else if(e.status === 429){
        var reason = e.data && e.data.reason;
        if(reason === 'month_limit'){
          chats[activeId].push({ role:'ai', text:"You've used this month's builds. Your allowance resets at the start of next month — or add a top-up from your dashboard to carry on now." });
          speak("That's this month's builds used.");
        } else {
          var when = e.data && e.data.resetsAt ? new Date(e.data.resetsAt) : null;
          var mins = when ? Math.max(1, Math.round((when - new Date())/60000)) : null;
          var pretty = mins ? (mins >= 60 ? ('about ' + Math.round(mins/60) + ' hour' + (mins>=120?'s':'')) : (mins + ' minutes')) : 'a few hours';
          chats[activeId].push({ role:'ai', text:"You've used this session's builds. More unlock in " + pretty + " — or add a top-up from your dashboard to carry on now." });
          speak("That's this session's builds used.");
        }
      } else if(e.status === 402){
        chats[activeId].push({ role:'ai', text:'You need an active subscription to build. Choose a plan to get started.' });
        setTimeout(function(){ window.location.href='/#pricing'; }, 2200);
      } else if(e.status === 403){
        chats[activeId].push({ role:'ai', text:"That model isn't included in your plan. Pick another, or upgrade to Frontier for Claude Fable 5." });
      } else if(e.status === 409 && e.data && e.data.error === 'no_saved_site'){
        // The server just told us, authoritatively, that nothing is
        // actually saved for this project -- correct our local belief
        // to match, so the next message is classified as a genuine new
        // build instead of hitting this same refusal again.
        p.current_code = null;
        chats[activeId].push({ role:'ai', text: e.data.message || "This project has no saved site on the server, so it can't be edited. The site you were viewing was never saved. Your next message will start a new build from scratch." });
      } else {
        chats[activeId].push({ role:'ai', text: (e.message || 'The build failed.') + " You haven't been charged a build — try again." });
      }
      renderChat();
      renderPreview();
    }finally{
      activeController = null;
      sendBtn.classList.remove('busy');
      setGenerating(false);
    }
  }

  // ---------- version history ----------
  async function openHistory(){
    var p=active(); if(!p) return;
    histList.innerHTML='<div class="none">Loading…</div>';
    histPanel.classList.add('show');
    try{
      var out = await Lumen.api('/api/projects/'+p.id+'/versions');
      var v = out.versions || [];
      if(!v.length){ histList.innerHTML='<div class="none">No versions yet — build something and each version is saved here.</div>'; return; }
      histList.innerHTML = v.map(function(x,i){
        return '<div class="hrow" data-id="'+x.id+'"><div class="hn">v'+(v.length-i)+'</div><div><div class="ht">'+esc(x.label||'Build')+'</div><div class="hm">'+new Date(x.created_at).toLocaleString()+'</div></div></div>';
      }).join('');
      histList.querySelectorAll('.hrow').forEach(function(r){
        r.addEventListener('click', async function(){
          try{
            var res = await Lumen.api('/api/projects/'+p.id+'/restore', {
              method:'POST', body: JSON.stringify({ versionId: r.getAttribute('data-id') })
            });
            p.current_code = res.code;
            histPanel.classList.remove('show');
            renderAll(); toast('Version restored');
          }catch(e){ toast(e.message); }
        });
      });
    }catch(e){ histList.innerHTML='<div class="none">'+esc(e.message)+'</div>'; }
  }

  // ---------- wire up ----------
  document.getElementById('send').addEventListener('click', send);
  promptEl.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.altKey){
      // Browsers don't reliably insert a newline for Alt+Enter in a
      // textarea the way they do for Shift+Enter, so it's done by hand:
      // splice \n in at the caret, then put the caret right after it.
      e.preventDefault();
      var start=promptEl.selectionStart, end=promptEl.selectionEnd;
      promptEl.value = promptEl.value.slice(0,start) + '\n' + promptEl.value.slice(end);
      promptEl.selectionStart = promptEl.selectionEnd = start+1;
      promptEl.style.height='auto'; promptEl.style.height=Math.min(promptEl.scrollHeight,140)+'px';
      return;
    }
    if(e.key==='Enter' && !e.shiftKey && !e.altKey){ e.preventDefault(); send(); }
  });
  promptEl.addEventListener('input', function(){ promptEl.style.height='auto'; promptEl.style.height=Math.min(promptEl.scrollHeight,140)+'px'; });

  document.getElementById('segChat').addEventListener('click', function(){ setMode('chat'); });
  document.getElementById('segCode').addEventListener('click', function(){ setMode('code'); });

  document.getElementById('newtab').addEventListener('click', async function(){
    try{
      var made = await Lumen.api('/api/projects', { method:'POST', body: JSON.stringify({ name:'New project' }) });
      projects.push(made.project); activeId=made.project.id;
      setMode('chat'); renderAll(); promptEl.focus();
    }catch(e){ toast(e.message); }
  });

  tabsLeftBtn.addEventListener('click', function(){ tabsEl.scrollBy({ left: -tabScrollStep(), behavior:'smooth' }); });
  tabsRightBtn.addEventListener('click', function(){ tabsEl.scrollBy({ left: tabScrollStep(), behavior:'smooth' }); });
  tabsEl.addEventListener('scroll', updateTabScroll);
  window.addEventListener('resize', updateTabScroll);

  document.getElementById('fork').addEventListener('click', async function(){
    var p=active(); if(!p) return;
    try{
      var out = await Lumen.api('/api/projects/'+p.id+'?fork=true', { method:'PATCH' });
      projects.push(out.project); activeId=out.project.id;
      renderAll(); toast('Forked into a new project');
    }catch(e){ toast(e.message); }
  });

  document.getElementById('github').addEventListener('click', function(){ toast('GitHub push is coming soon'); });

  // ---------- publishing ----------
  var pubWrap=document.getElementById('pubWrap');
  var pubErr=document.getElementById('pubErr');
  var liveBox=document.getElementById('liveBox');
  var liveUrl=document.getElementById('liveUrl');
  var pubSlug=document.getElementById('pubSlug');
  var pubGo=document.getElementById('pubGo');
  var pubOff=document.getElementById('pubOff');

  function pubError(msg){ pubErr.textContent=msg; pubErr.classList.add('show'); }
  function pubClear(){ pubErr.classList.remove('show'); }

  function showLive(data){
    if(data && data.published && data.url){
      liveBox.style.display='block';
      liveUrl.textContent=data.url;
      liveUrl.href=data.url;
      pubOff.style.display='inline-flex';
      pubGo.textContent='Update live site';
      document.getElementById('pubTitle').textContent='Your site is live';
      document.getElementById('pubSub').textContent='Any changes you make are published when you press update.';
      if(data.subdomain) pubSlug.value=data.subdomain;
      if(data.customDomain) document.getElementById('pubDomain').value=data.customDomain;
    } else {
      liveBox.style.display='none';
      pubOff.style.display='none';
      pubGo.textContent='Publish site';
      document.getElementById('pubTitle').textContent='Publish your site';
      document.getElementById('pubSub').textContent='Choose a web address and your site goes live straight away.';
    }
  }

  function suggestSlug(){
    var p=active(); if(!p) return '';
    return (p.name||'site').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  }

  // Show the right suffix for the address (depends on SITES_DOMAIN)
  (async function(){
    try{
      var cfg = await (await fetch('/api/config')).json();
      var el = document.getElementById('slugSuffix');
      if (el) el.textContent = cfg.sitesDomain ? ('.' + cfg.sitesDomain) : ' (lumen address)';
    }catch(e){}
  })();

  document.getElementById('publish').addEventListener('click', async function(){
    var p=active();
    if(!p){ toast('Open a project first'); return; }
    if(!p.current_code){ toast('Build something first'); return; }

    pubClear();
    pubWrap.classList.add('show');
    pubSlug.value = suggestSlug();

    try{
      var status = await Lumen.api('/api/publish?projectId='+p.id);
      showLive(status);
    }catch(e){ showLive(null); }
  });

  document.getElementById('pubClose').addEventListener('click', function(){ pubWrap.classList.remove('show'); });
  pubWrap.addEventListener('click', function(e){ if(e.target===pubWrap) pubWrap.classList.remove('show'); });

  pubGo.addEventListener('click', async function(){
    var p=active(); if(!p) return;
    pubClear();
    pubGo.disabled=true; var label=pubGo.textContent; pubGo.textContent='Publishing…';
    try{
      var out = await Lumen.api('/api/publish', {
        method:'POST',
        body: JSON.stringify({ projectId:p.id, slug: pubSlug.value.trim() || undefined })
      });
      showLive(out);
      toast('Your site is live');
    }catch(e){
      pubError(e.message || 'Could not publish.');
      if(e.status===402) setTimeout(function(){ window.location.href='/#pricing'; }, 2200);
    }finally{
      pubGo.disabled=false; if(pubGo.textContent==='Publishing…') pubGo.textContent=label;
    }
  });

  pubOff.addEventListener('click', async function(){
    var p=active(); if(!p) return;
    pubOff.disabled=true;
    try{
      await Lumen.api('/api/publish?projectId='+p.id, { method:'DELETE' });
      showLive(null);
      toast('Site unpublished');
    }catch(e){ pubError(e.message); }
    finally{ pubOff.disabled=false; }
  });

  document.getElementById('copyUrl').addEventListener('click', function(){
    navigator.clipboard.writeText(liveUrl.textContent).then(function(){ toast('Address copied'); });
  });

  document.getElementById('showDomain').addEventListener('click', function(){
    var b=document.getElementById('domainBlock');
    b.style.display = b.style.display==='none' ? 'block' : 'none';
  });

  document.getElementById('domainGo').addEventListener('click', async function(){
    var p=active(); if(!p) return;
    var d=document.getElementById('pubDomain').value.trim();
    if(!d) return;
    pubClear();
    var b=this; b.disabled=true; b.textContent='Connecting…';
    try{
      var out = await Lumen.api('/api/domains', { method:'POST', body: JSON.stringify({ projectId:p.id, domain:d }) });
      var rows = (out.dns||[]).map(function(r){
        return '<tr><td>'+esc(r.type)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.value)+'</td></tr>';
      }).join('');
      document.getElementById('dnsRows').innerHTML = rows;
      document.getElementById('dnsBox').classList.add('show');
      document.getElementById('dnsNote').textContent = out.note || '';
      toast('Domain saved');
    }catch(e){ pubError(e.message || 'Could not connect that domain.'); }
    finally{ b.disabled=false; b.textContent='Connect domain'; }
  });
  document.getElementById('history').addEventListener('click', function(e){ e.stopPropagation(); openHistory(); });
  document.addEventListener('click', function(e){
    if(histPanel.classList.contains('show') && !histPanel.contains(e.target) && e.target.id!=='history') histPanel.classList.remove('show');
  });

  var MAX_IMAGES = 5;
  var MAX_IMAGE_BYTES = 5 * 1024 * 1024 * 3 / 4; // keeps the base64 payload under Claude's 5MB limit, matching the backend

  function addImageFiles(files){
    var count = pendingFiles.length;
    Array.prototype.slice.call(files).forEach(function(file){
      if(!/^image\//.test(file.type)){ toast(file.name + ' is not an image — skipped'); return; }
      if(count >= MAX_IMAGES){ toast('You can attach up to ' + MAX_IMAGES + ' images'); return; }
      if(file.size > MAX_IMAGE_BYTES){ toast(file.name + ' is too large — try under 3.75MB'); return; }
      count++;
      var reader = new FileReader();
      reader.onload = function(){
        pendingFiles.push({ name: file.name, mediaType: file.type, dataUrl: reader.result });
        renderChips();
      };
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('attach').addEventListener('click', function(){ document.getElementById('fileinput').click(); });
  document.getElementById('fileinput').addEventListener('change', function(e){
    addImageFiles(e.target.files);
    e.target.value='';
  });

  promptEl.addEventListener('paste', function(e){
    var items = (e.clipboardData && e.clipboardData.items) || [];
    var files = [];
    for(var i=0;i<items.length;i++){
      if(items[i].kind==='file' && /^image\//.test(items[i].type)){
        var f = items[i].getAsFile();
        if(f) files.push(f);
      }
    }
    if(files.length){
      e.preventDefault();
      addImageFiles(files);
      toast(files.length===1 ? 'Image pasted' : files.length+' images pasted');
    }
  });

  // ---------- voice ----------
  var V = window.LumenVoice;
  var micBtn = document.getElementById('mic');
  var voiceBar = document.getElementById('voiceBar');
  var voiceText = document.getElementById('voiceText');
  var speakToggle = document.getElementById('speakToggle');
  var speakOn = V ? V.voiceReplies() : false;

  function paintSpeak(){
    if(!speakToggle) return;
    speakToggle.classList.toggle('on', speakOn);
    speakToggle.title = speakOn ? 'Spoken replies on' : 'Spoken replies off';
  }
  paintSpeak();

  if(speakToggle){
    speakToggle.addEventListener('click', function(){
      speakOn = !speakOn;
      V && V.voiceReplies(speakOn);
      paintSpeak();
      if(speakOn && V) V.say('Voice replies on.');
      else if(V) V.hush();
      toast(speakOn ? 'Spoken replies on' : 'Spoken replies off');
    });
  }

  function speak(text){
    if(speakOn && V) V.say(text);
  }

  if(V && V.supported){
    V.on('start', function(){
      micBtn.classList.add('listening');
      voiceBar.classList.add('show');
      voiceText.textContent = 'Listening — describe what you want.';
    });

    V.on('transcript', function(t){
      var text = t.text || (t.final + ' ' + t.interim).trim();
      voiceText.textContent = text || 'Listening…';
      promptEl.value = text;
      promptEl.dispatchEvent(new Event('input'));
    });

    V.on('denied', function(){
      micBtn.classList.remove('listening');
      voiceBar.classList.remove('show');
      toast('Microphone blocked — allow it in your browser settings');
    });

    V.on('end', function(res){
      micBtn.classList.remove('listening');
      voiceBar.classList.remove('show');
      var text = (res.text || '').trim();
      if(text){
        promptEl.value = text;
        send();
      }
    });

    micBtn.addEventListener('click', function(){
      if(V.listening){ V.stop(); return; }
      if(V) V.hush();
      V.listen({ continuous: false });
    });

    document.getElementById('voiceStop').addEventListener('click', function(){ V.stop(); });

    // A seed prompt spoken on the homepage arrives here
    try{
      var spoken = localStorage.getItem('lumen_seed_prompt');
      if(spoken) speak("Right — building that now.");
    }catch(e){}

  } else {
    micBtn.addEventListener('click', function(){
      toast('Voice input works in Chrome and Edge');
    });
  }

  // ---------- device preview ----------
  var previewWrap = document.querySelector('.previewwrap');
  var SIZES = { desktop:null, tablet:{w:834,h:1112}, mobile:{w:390,h:844} };
  function setDevice(kind){
    ['desktop','tablet','mobile'].forEach(function(k){
      var b=document.getElementById('dev'+k.charAt(0).toUpperCase()+k.slice(1));
      if(b) b.classList.toggle('on', k===kind);
    });
    var s = SIZES[kind];
    if(!s){
      preview.classList.remove('device');
      previewWrap.classList.remove('framed');
      preview.style.width=''; preview.style.height='';
    } else {
      preview.classList.add('device');
      previewWrap.classList.add('framed');
      var avail = previewWrap.clientHeight - 44;
      var scale = Math.min(1, avail / s.h);
      preview.style.width = s.w + 'px';
      preview.style.height = Math.min(s.h, avail) + 'px';
    }
  }
  document.getElementById('devDesktop').addEventListener('click', function(){ setDevice('desktop'); });
  document.getElementById('devTablet').addEventListener('click', function(){ setDevice('tablet'); });
  document.getElementById('devMobile').addEventListener('click', function(){ setDevice('mobile'); });

  // ---------- undo ----------
  var undoStack = {};   // projectId -> previous code
  function pushUndo(p){
    if(!p || !p.current_code) return;
    undoStack[p.id] = p.current_code;
    paintUndo();
  }
  function paintUndo(){
    var p=active();
    var btn=document.getElementById('undoBtn');
    if(btn) btn.disabled = !(p && undoStack[p.id]);
  }
  document.getElementById('undoBtn').addEventListener('click', async function(){
    var p=active(); if(!p || !undoStack[p.id]) return;
    var previous = undoStack[p.id];
    delete undoStack[p.id];
    p.current_code = previous;
    renderAll(); paintUndo();
    toast('Reverted the last change');
    // History already holds every version, so this is a local step back.
  });

  // ---------- export ----------
  document.getElementById('exportBtn').addEventListener('click', async function(){
    var p=active();
    if(!p || !p.current_code){ toast('Build something first'); return; }
    var session = await Lumen.session();
    if(!session) return;
    var choice = confirm('Download your site as a single HTML file?\n\nOK = the live site (index.html)\nCancel = everything, including version history');
    var url = '/api/export?projectId=' + p.id + (choice ? '' : '&all=1');
    var res = await fetch(url, { headers: { Authorization: 'Bearer ' + session.access_token } });
    if(!res.ok){ var e = await res.json().catch(function(){return {};}); toast(e.error || 'Export failed'); return; }
    var blob = await res.blob();
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (res.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1] || 'lumen-site.html';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Export downloaded');
  });

  document.getElementById('refresh').addEventListener('click', renderPreview);
  document.getElementById('openext').addEventListener('click', function(){
    var p=active();
    if(!p || !p.current_code){ toast('Build something first'); return; }
    var w=window.open(); w.document.write(p.current_code); w.document.close();
  });
  document.getElementById('model').addEventListener('change', function(){ toast('Now building with '+this.value); });

  // ---------- boot ----------
  (async function(){
    var session = await Lumen.requireAuth('/start');
    if(!session) return;
    setMode('chat');
    await refreshUsage();
    await loadProjects();

    // A template chosen on the Templates page seeds the first build
    try{
      var seed=localStorage.getItem('lumen_seed_prompt');
      if(seed){ localStorage.removeItem('lumen_seed_prompt'); promptEl.value=seed; promptEl.dispatchEvent(new Event('input')); send(); }
    }catch(e){}
  })();
})();
</script>
<script>
(function(){
  var b=document.getElementById('signout');
  if(b) b.addEventListener('click', function(){ Lumen.signOut(); });
})();
</script>
<script src="/ray.js"></script>
</body>
</html>
